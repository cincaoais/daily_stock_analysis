# Chan Theory (default) / 缠论综合
# Structure comes from the code-computed chan snapshot; the model only interprets it.

name: chan_theory
display_name: 缠论综合
description: 默认个股分析策略。依据程序计算的缠论结构快照（笔、中枢、背驰、买卖点），按“级别 → 结构 → 买卖点 → 失效价”给出结论。
category: framework
core_rules: [1, 2, 3, 4, 5, 6, 7]
required_tools:
  - get_chan_structure
  - get_realtime_quote
  - get_daily_history
aliases: [缠论, 缠论分析, 缠中说禅, chan]
default_active: true
default_router: true
default_priority: 10
market_regimes: [trending_up, trending_down, sideways, volatile]

instructions: |
  **缠论综合（Chan Theory, default）**

  结构事实只来自“缠论结构快照”（提示词中已提供时直接使用，否则调用 `get_chan_structure`）。
  不要自己从 K 线数笔、画中枢或估算背驰；快照没有的结构一律写“快照未提供”。

  分析步骤（按顺序，不得跳过）：

  1. **定级别**：以日线（D）为操作级别，周线（W）定方向，60M/30M 找精确进出场。
     某级别 `status` 不是 `available` 时，说明缺失原因并降低置信度。
  2. **读结构**：逐级别说明 `trend_type`（up 上涨 / down 下跌 / consolidation 盘整）、
     现价相对最近中枢的位置（`position_vs_last_zhongshu`）以及当前笔方向和 `state`。
  3. **看背驰**：只引用 `divergence.present=true` 的记录，并写明比较的两笔（`stroke_id` / `compared_stroke_id`）、`strength_ratio` 与 `state`。
     `state` 不是 confirmed 的背驰只能写“背驰形成中/候选，待确认”。
  4. **定买卖点**：只使用 `buy_sell_points` 中 `still_valid=true` 的点。
     一买/一卖（1B/1S）看背驰，二买/二卖（2B/2S）看回抽不破，三买/三卖（3B/3S）看离开中枢后回抽不回中枢。
     没有有效买卖点时，结论为“无买卖点，不操作/持有观察”，不得硬凑。
  5. **定失效与仓位**：止损锚定该买卖点的 `invalidation_price`；目标参考 `key_levels` 与上方中枢的 ZD/ZG。
     大级别与操作级别同向（`cross_level.resonance=full`）可用正常仓位，仅部分共振减半，逆大级别只做短线轻仓。
  6. **完全分类**：给出“走强 / 震荡 / 走弱”三种后续走势各自的触发价位与应对，不做单一预测。

  评分调整建议：
  - 操作级别有效买点且大级别同向：`sentiment_score +12`
  - 操作级别有效买点但大级别反向或数据不全：`sentiment_score +5`
  - 无有效买卖点、价格在中枢内：`sentiment_score 维持基准`
  - 操作级别有效卖点或跌破买点失效价：`sentiment_score -12`
